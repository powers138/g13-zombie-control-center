name: Feature request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the limitation or use case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or related behavior
      description: Describe any workarounds or similar behavior in Logitech Gaming Software, if relevant.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, examples, or other useful context.
